[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aihydro-core"
version = "0.1.0"
description = "AI-Hydro robustness substrate: hashing, provenance, Store protocol, async jobs, feature addressing"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Mohammad Galib", email = "mgalib@purdue.edu"}
]
readme = "README.md"
keywords = ["hydrology", "agentic", "MCP", "SDK", "robustness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Zero heavy dependencies — this is the substrate.
# Pure stdlib + optional typing_extensions for 3.9 compat.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/AI-Hydro/aihydro-core"
Repository = "https://github.com/AI-Hydro/aihydro-core"

[tool.setuptools.packages.find]
where = ["."]
include = ["aihydro_core*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: tests requiring internet or real filesystem",
]
