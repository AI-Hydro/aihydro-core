[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aihydro-core"
version = "0.2.0"
description = "AI-Hydro robustness substrate: hashing, provenance, Store protocol, async jobs, feature addressing, result contract"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Mohammad Galib", email = "mgalib@purdue.edu"}
]
readme = "README.md"
keywords = ["hydrology", "agentic", "MCP", "SDK", "robustness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Zero heavy dependencies in the BASE — this is the substrate.
# `import aihydro_core` is stdlib-only. The pydantic-backed result contract
# (contracts.py) and the science kernel (science/) are gated behind extras so
# the base substrate stays dependency-free; consumers that use the contract
# declare `aihydro-core[contracts]`.
dependencies = []

[project.optional-dependencies]
contracts = ["pydantic>=2.0"]   # HydroResult/HydroMeta/DataSource/HydroTool
science = ["pydantic>=2.0"]     # Claim/Auditor/UncertaintyProvider kernel
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "import-linter>=2.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/AI-Hydro/aihydro-core"
Repository = "https://github.com/AI-Hydro/aihydro-core"

[tool.setuptools.packages.find]
where = ["."]
include = ["aihydro_core*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: tests requiring internet or real filesystem",
]

# --------------------------------------------------------------------------- #
# Layering contract — core depends on NOBODY.
# Run with:  lint-imports  (requires `pip install import-linter`)
# Also enforced offline by tests/test_layering.py (no extra install needed).
# --------------------------------------------------------------------------- #
[tool.importlinter]
root_package = "aihydro_core"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "aihydro_core depends on nobody above it"
type = "forbidden"
source_modules = ["aihydro_core"]
forbidden_modules = ["ai_hydro", "aihydro_data"]
